[project]
name = "dubplanetar"
version = "0.8.251"
description = "Empilement GPU Soleil/Lune pour vidéos RAW SeeStar (S50, S30, S30 Pro)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11",
    "cupy-cuda12x[ctk]>=14.0",
    "numpy>=2.0,<2.6",
    "opencv-python-headless>=4.10,<5",
    "tifffile>=2025.1",
]

[project.scripts]
dubplanetar = "dub_planetar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dub_planetar = ["translations/*.qm"]
